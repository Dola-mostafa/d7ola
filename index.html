*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  background:linear-gradient(135deg,#2e1065,#4c1d95,#2563eb,#0e7490);
  background-size:300% 300%;
  animation:bg 12s ease infinite;
  background-attachment:fixed;
  color:#fff;min-height:100vh;padding:14px;
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{max-width:1050px;margin:auto;position:relative;z-index:1}
.glass{
  background:rgba(255,255,255,0.14);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.5);
}

.navbar .links a.active{background:#fff;color:#4c1d95}
