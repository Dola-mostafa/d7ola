<!DOCTYPE html>

*{
  margin:0;padding:0;box-sizing:border-box;
  font-family:'Cairo',sans-serif;
}
body{
  background: linear-gradient(135deg,#7c3aed 0%,#2563eb 50%,#06b6d4 100%);
  background-attachment: fixed;
  color:#fff;
  min-height:100vh;
  padding:20px;
}
body::before{
  content:"";
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:
  radial-gradient(circle at 20% 20%, rgba(255,255,255,.25) 0%, transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(255,255,255,.20) 0%, transparent 40%);
  pointer-events:none;
  z-index:0;
}
.container{
  max-width:1000px;
  margin:auto;
  position:relative;
  z-index:1;
}

/* الهيدر الزجاجي */
header{
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:24px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.5);
  margin-bottom:20px;
}
header h1{
  font-size:38px;
  font-weight:900;
  text-shadow:0 2px 10px rgba(0,0,0,0.3);
}
header p{
  opacity:.9;
  font-size:16px;
  margin-top:5px;
}

/* الاحصائيات */
.stats{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
