<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dola - دولا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{
  margin:0;padding:0;box-sizing:border-box;
  font-family:'Cairo',sans-serif;
}
body{
  background: linear-gradient(135deg,#7c3aed 0%,#2563eb 50%,#06b6d4 100%);
  background-attachment: fixed;
  color:#fff;
  min-height:100vh;
  padding:20px;
}
body::before{
  content:"";
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:
  radial-gradient(circle at 20% 20%, rgba(255,255,255,.25) 0%, transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(255,255,255,.20) 0%, transparent 40%);
  pointer-events:none;
  z-index:0;
}
.container{
  max-width:1000px;
  margin:auto;
  position:relative;
  z-index:1;
}

/* الهيدر الزجاجي */
header{
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:24px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.5);
  margin-bottom:20px;
}
header h1{
  font-size:38px;
  font-weight:900;
  text-shadow:0 2px 10px rgba(0,0,0,0.3);
}
header p{
  opacity:.9;
  font-size:16px;
  margin-top:5px;
}

/* الاحصائيات */
.stats{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.stat{
  flex:1;
  min-width:140px;
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:20px;
  padding:18px;
  text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
}
.stat b{
  display:block;
  font-size:26px;
}
.stat span{
  font-size:13px;
  opacity:.85;
}

/* الكروت */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}
.card{
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:22px;
  padding:22px;
  box-shadow:0 10px 35px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.5);
  transition:.3s;
}
.card:hover{
  transform:translateY(-5px);
  background: rgba(255,255,255,0.25);
}
.card h3{
  font-size:20px;
  margin-bottom:8px;
}
.card p{
  font-size:14px;
  opacity:.9;
  line-height:1.7;
  margin-bottom:15px;
}

/* الزرار */
.btn{
  display:block;
  width:100%;
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(12px);
  border:1px solid rgba(255,255,255,0.55);
  color:#fff;
  font-weight:bold;
  font-size:16px;
  padding:13px;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
  transition:.3s;
}
.btn:hover{
  background: rgba(255,255,255,0.45);
}

/* المدخلات */
input,textarea,select{
  width:100%;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.4);
  border-radius:14px;
  color:#fff;
  padding:13px;
  outline:none;
  margin-bottom:12px;
  font-size:15px;
}
input::placeholder,textarea::placeholder{
  color:rgba(255,255,255,0.8);
}

/* الفوتر */
footer{
  text-align:center;
  margin-top:25px;
  opacity:.85;
  font-size:13px;
}
</style>
</head>
<body>

<div class="container">

<header>
  <h1>✨ Dola دولا ✨</h1>
  <p>موقعك الجديد - واجهة زجاجية شفافة</p>
</header>

<div class="stats">
  <div class="stat"><b>+120</b><span>زائر اليوم</span></div>
  <div class="stat"><b>98%</b><span>تقييم المستخدمين</span></div>
  <div class="stat"><b>24/7</b><span>شغال على طول</span></div>
</div>

<div class="grid">
  <div class="card">
    <h3>🚀 قسم 1</h3>
    <p>اكتب هنا الوصف بتاع القسم الأول بتاع موقعك يا دولا.</p>
    <button class="btn" onclick="alert('اهلا بيك يا دولا 🔥')">دوس هنا</button>
  </div>

  <div class="card">
    <h3>💎 قسم 2</h3>
    <p>اكتب هنا الوصف بتاع القسم التاني.</p>
    <button class="btn" onclick="alert('القسم التاني اشتغل ✅')">دوس هنا</button>
  </div>

  <div class="card">
    <h3>📩 تواصل معانا</h3>
    <input type="text" placeholder="اسمك">
    <input type="text" placeholder="رسالتك">
    <button class="btn">ابعت الرسالة</button>
  </div>
</div>

<footer>صُنع بحب ❤️ بواسطة دولا - Dola © 2026</footer>

</div>

</body>
    </html>
