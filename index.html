}
body {
  background: #070b14;
  background-image: radial-gradient(circle at 20% 10%, rgba(255, 45, 85, 0.25), transparent 40%), radial-gradient(circle at 90% 20%, rgba(0, 210, 255, 0.20), transparent 40%), linear-gradient(180deg, #0a0f1e 0%, #070b14 100%);

  min-height: 100vh;
  padding: 14px;
}
.container {
  max-width: 480px;
  margin: auto;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);

  border-radius: 18px;
}

  font-size: 19px;
  font-weight: 900;
}

  font-size: 12px;

  border: 1px solid rgba(255, 45, 85, 0.4);
  padding: 5px 10px;
  border-radius: 20px;
  font-weight: 800;
}
.profile {
  text-align: center;
  margin-bottom: 16px;
  background: linear-gradient(135deg, rgba(255, 45, 85, 0.25), rgba(0, 210, 255, 0.18));
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  padding: 20px 14px 16px;
  position: relative;
  overflow: hidden;
}
.avatar {
  width: 96px;
  height: 96px;
  margin: auto;

  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 900;
  color: #ffffff;
  border: 3px solid #ff2d55;
  box-shadow: 0 0 0 4px #070b14, 0 0 30px rgba(255, 45, 85, 0.6);
}
.profile h2 {
  font-size: 30px;
  margin-top: 10px;
  font-weight: 900;
}
.profile h2 span {
  color: #00d2ff;
}
.profile p {
  color: #cbd5e1;
  font-size: 13px;
  margin-top: 4px;
}
.badges {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

  border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 6px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
